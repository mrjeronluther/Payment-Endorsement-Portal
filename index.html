    /* ==========================================
     BASE UI & LOADING PANE
     ========================================== */
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    #loading-pane {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-logo {
      max-width: 250px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    /* DASHBOARD CARDS */
    .card-form {
      border-left: 5px solid #0d6efd;
    }

    .elegant-card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: 0.2s;
      border-radius: 10px;
      cursor: pointer;
    }

    .elegant-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .note-line {
      width: 100%;
      height: 30px;
      border-bottom: 1px solid #000 !important;
      margin-top: 2px;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      .printable-content,
      .printable-content * {
        visibility: visible;
      }

      @page {
        size: letter portrait;
        margin: 0.4in;
      }

      .printable-content {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }

      .print-logo {
        display: block !important;
      }

      /* 1. FORCE THE GRID TO STAY RECTANGULAR */
      .particulars-grid {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        /* STOPS WIDTH ADJUSTMENT */
        border: 1.5px solid #000 !important;
      }

      /* 2. FORCE WRAPPING ON TEXT */
      .grid-cell {
        border: 1px solid #000 !important;
        padding: 8px 10px;
        vertical-align: top;
        width: 33.33%;
        /* Strict Column Width */
        word-wrap: break-word;
        /* Standard */
        overflow-wrap: break-word;
        /* Modern */
        white-space: normal;
        /* Ensure spaces trigger wrapping */
      }

      .meta-table {
        width: 100%;
        border: none !important;
        margin-bottom: 25px;
        table-layout: fixed;
      }

      .meta-table td {
        border: none !important;
        vertical-align: bottom;
      }

      .sig-name-line {
        border-top: 1.2px solid #000 !important;
        width: 90%;
        margin: 45px auto 0 auto;
        font-size: 8pt;
        font-weight: bold;
        text-transform: uppercase;
        padding-top: 5px;
        text-align: center;
      }
    }

    .custom-dropdown-menu {
      border: 1px solid #dee2e6;
      border-top: none;
      background: white;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
    }

    .custom-dropdown-menu .list-group-item {
      cursor: pointer;
      font-size: 0.9rem;
      padding: 10px 15px;
      border: none;
      border-bottom: 1px solid #f8f9fa;
    }

    .custom-dropdown-menu .list-group-item:last-child {
      border-bottom: none;
    }

    .custom-dropdown-menu .list-group-item:hover {
      background-color: #f0f7ff;
      color: #0d6efd;
    }

    .cursor-pointer {
      cursor: pointer;
    }

    /* Progress Stepper */
.step-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #e9ecef;
    color: #adb5bd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s;
}
.step-dot.active {
    background: #0d6efd;
    color: white;
}
.step-line {
    flex-grow: 1;
    height: 2px;
    background: #e9ecef;
    margin: auto 8px;
}
.icon-circle {
    width: 60px;
    height: 60px;
    background: #f8f9fa;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Password Toggle Icon positioning */
.password-toggle-icon-new {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    z-index: 10;
    color: #6c757d;
}

.password-toggle-icon-new:hover {
    color: #0d6efd;
}

/* Helpers */
.tiny { font-size: 0.75rem; }
.tracking-wider { letter-spacing: 0.05em; }
.letter-spacing-lg { letter-spacing: 5px; }

/* Animation - requires Animate.css link in header or can be replaced with custom transitions */
.animate__animated {
    animation-duration: 0.5s;
}
  </style>

<body>
  <div id="app">
    <div v-if="isLoading" id="loading-pane">
      <img
          src="https://d2nnykqiaju69u.cloudfront.net/pslife_photos/Maricel_temp/logos/megaworld%20lifestyel%20malls.png"
          alt="Logo"
          class="loading-logo mb-3"
        />
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted fw-bold">{{ loadingMessage }}</p>
    </div>

    <div class="modal fade" id="customAlertModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" :class="alertTypeClass">
              <i :class="alertIconClass"></i> {{ alertTitle }}
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center py-4">
            <p class="fs-5">{{ alertMessage }}</p>
          </div>
          <div class="modal-footer border-0 justify-content-center">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">Acknowledge</button>
          </div>
        </div>
      </div>
    </div>

    <div class="container py-5" v-show="!isLoading">
      <div class="text-center mb-5" v-if="!['login', 'register', 'forgot_password'].includes(currentView)">
        <img
            src="https://d2nnykqiaju69u.cloudfront.net/pslife_photos/Maricel_temp/logos/megaworld%20lifestyel%20malls.png"
            alt="Megaworld Logo"
            style="height: 60px"
          />
        <h3 class="mt-3 fw-bold text-secondary">PAYMENT ENDORSEMENT PLATFORM</h3>
      </div>

      <login-view v-if="currentView === 'login'" @navigate="changeView"></login-view>
      <register-view v-if="currentView === 'register'" @navigate="changeView"></register-view>
      <forgot-password-view v-if="currentView === 'forgot_password'" @navigate="changeView"></forgot-password-view>
      <dashboard-view v-if="currentView === 'dashboard'" @navigate="changeView"></dashboard-view>
      <form-request-view v-if="currentView === 'form_request'" @navigate="changeView"></form-request-view>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- COMPONENT: Login View ---
      const LoginView = {
        template: `
    <div class="auth-page-static d-flex align-items-center justify-content-center" 
         style="height: 100vh; width: 100vw; overflow: hidden; background-color: #f4f7f6; position: fixed; top: 0; left: 0;">
        
        <div class="auth-container animation-fade-in w-100" style="max-width: 520px; padding: 20px;">
            <div class="card elegant-card border-0 p-4 p-md-5 shadow-lg" style="border-radius: 15px;">
                
                <div class="text-center mb-4">
                    <img src="https://d2nnykqiaju69u.cloudfront.net/pslife_photos/Maricel_temp/logos/megaworld%20lifestyel%20malls.png" 
                         alt="Megaworld Logo" style="height: 60px;" class="mb-3">
                    <h4 class="fw-bold text-secondary" style="font-size: 1.1rem; letter-spacing: 0.5px;">PAYMENT ENDORSEMENT PLATFORM</h4>
                    <p class="text-muted small">Sign in to your account</p>
                </div>
                
                <form @submit.prevent="submitLogin" id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">EMAIL ADDRESS</label>
                        <input 
                            type="email" 
                            name="email" 
                            class="form-control form-control-lg bg-light border-0 shadow-sm" 
                            v-model="credentials.email" 
                            placeholder="example@gmail.com" 
                            autocomplete="username email"
                            list="emailHistory"
                            required>
                        <datalist id="emailHistory">
                            <option v-for="email in suggestedEmails" :key="email" :value="email"></option>
                        </datalist>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">PASSWORD</label>
                        <div class="password-wrapper position-relative">
                            <input :type="showPassword ? 'text' : 'password'" 
                                   name="password"
                                   class="form-control form-control-lg bg-light border-0 shadow-sm pe-5" 
                                   v-model="credentials.password" 
                                   autocomplete="current-password"
                                   required>
                            <i :class="['bi', showPassword ? 'bi-eye-slash' : 'bi-eye', 'password-toggle-icon']" 
                               style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d;"
                               @click="showPassword = !showPassword"></i>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow mb-3" style="border-radius: 8px;">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="#" class="text-decoration-none small text-primary fw-semibold d-block mb-2" 
                       @click.prevent="$emit('navigate', 'forgot_password')">Forgot Password?</a>
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="#" class="text-decoration-none small fw-bold" 
                       @click.prevent="$emit('navigate', 'register')">Create Account</a>
                </div>
            </div>
        </div>
    </div>
    `,
        data() {
          return {
            credentials: { email: "", password: "" },
            showPassword: false,
            suggestedEmails: [],
          };
        },
        mounted() {
          this.loadSuggestedEmails();
        },
        methods: {
          loadSuggestedEmails() {
            try {
              const history = localStorage.getItem("pep_login_history");
              this.suggestedEmails = history ? JSON.parse(history) : [];
            } catch (e) {
              console.warn("Local storage inaccessible", e);
            }
          },
          saveEmailToHistory(email) {
            try {
              let historySet = new Set(this.suggestedEmails);
              historySet.add(email.toLowerCase().trim());

              const updatedHistory = Array.from(historySet).slice(-5);
              localStorage.setItem("pep_login_history", JSON.stringify(updatedHistory));
              this.suggestedEmails = updatedHistory;
            } catch (e) {
              console.error("History sync failed", e);
            }
          },
          submitLogin() {
            if (!this.credentials.email || !this.credentials.password) {
              return this.$root.showCustomAlert("Input Error", "Enter credentials.", "warning");
            }

            this.$root.triggerLoading("Verifying Account Access...", 0);

            google.script.run
              .withSuccessHandler((response) => {
                this.$root.isLoading = false;
                this.$root.currentUser = response.user.fullName;
                this.$root.currentUserEmail = response.user.email;

                // Save to custom history and trigger browser save-password prompt
                this.saveEmailToHistory(this.credentials.email);

                this.$root.showCustomAlert("Welcome", "Login successful.", "success");
                this.$emit("navigate", "dashboard");
              })
              .withFailureHandler((err) => {
                this.$root.isLoading = false;
                this.$root.showCustomAlert("Login Failed", err.message, "error");
              })
              .authenticateUser(this.credentials);
          },
        },
      };
     const RegisterView = {
  template: `
    <div class="auth-container mt-5">
        <div class="card elegant-card border-0 p-4 shadow-lg mx-auto" style="max-width: 450px;">
            
            <!-- HEADER SECTION -->
            <div class="text-center mb-4">
                <div class="icon-circle mb-3 mx-auto">
                    <i class="bi bi-person-plus text-primary fs-3"></i>
                </div>

        data() {
          return {
            // 1. FORM HEADER DATA (Payload for Submission)

              rfpNo: "",

              dueDate: "",
              sourceFileName: "", // Bound to the searchable input text
              sourceFileUrl: "", // Captured URL from selection
              sourceTabName: "", // Selected tab from the second dropdown
              primaryEmail: "",
              secondaryEmails: "",
            },

            // 2. UI STATE CONTROLS
            isSourceListOpen: false,
            isPrimaryListOpen: false,
            isSecondaryListOpen: false,
            isSearchModalOpen: false,
            isSubmitting: false,

            // 3. SEARCH & SUGGESTIONS
            sourceFiles: [], // Array of {name, url, tabs} from backend
            selectedSourceObj: null, // The full object of the currently selected file
            sourceSearchQuery: "", // Optional: if you prefer separating input from selection
            secondaryQuery: "",
            suggestedEmails: [],
            searchResults: [], // Results from performStrictSearch

            // 4. TRANSACTION & TABLE CONFIG
            attachment: {
              name: "",
              type: "",
              size: 0,
              base64: "",
            },
            tableFields: [
              "YEAR",
              "MONTH",
              "PAYOR NAME",
              "PAYEE NAME",
              "PROPERTY",
              "LOCATION",
              "SECTOR",
              "KINDS OF SERVICE",
              "CONTRACT NO",
              "CONTRACT AMOUNT",
              "BILLING PERIOD",
              "SOA AMOUNT",
              "GENERAL STATUS",
            ],
            particulars: {}, // Dynamic storage for loaded record fields
            cursorIndex: 0, // Navigation for dropdowns
          };
        },
        computed: {
          // Filtered Primary list (shows all if empty and focused)
          filteredPrimarySuggestions() {
            const query = (this.header.primaryEmail || "").toLowerCase();
            if (!query) return this.suggestedEmails; // Show all on first click
            return this.suggestedEmails.filter((e) => e.toLowerCase().includes(query));
          },

          // Filtered Secondary list based on what is after the last comma
          filteredSecondarySuggestions() {
            const query = (this.secondaryQuery || "").trim().toLowerCase();
            // Prevent showing emails already added in the string
            const currentContent = (this.header.secondaryEmails || "").toLowerCase();

            const available = this.suggestedEmails.filter((email) => {
              const isMatch = email.toLowerCase().includes(query);
              const isNotDuplicate = !currentContent.includes(email.toLowerCase() + ",");
              return isMatch && isNotDuplicate;
            });

            return available;
          },

          filteredSourceFiles() {
            const files = this.sourceFiles || [];
            const search = (this.header.sourceFileName || "").toLowerCase().trim();

            // If the list is open and nothing is typed, or the list was JUST opened
            // we return all files.
            if (!search) {
              return files;
            }

            // Filter based on input
            const results = files.filter((file) => {
              const fileName = (file.name || "").toLowerCase();
              const tabName = (file.tabName || "").toLowerCase();
              return fileName.includes(search) || tabName.includes(search);
            });

            // UX FIX: If search matches exactly one item (the selected one),
            // but the user just clicked it, show ALL files so they can switch.
            if (results.length === 1 && results[0].name === this.header.sourceFileName && this.isSourceListOpen) {
              return files;
            }

            return results;
          },
          minDueDate() {
            return new Date().toISOString().split("T")[0];
          },
          isSecurityValidated() {
         
            const hasInvoice = !!(this.header.invoiceNo?.trim());
  
            // Optional: Only validate due date if the user has manually changed it
            if (!this.header.dueDate) return true;
            const sel = new Date(this.header.dueDate).setHours(0, 0, 0, 0);
            const today = new Date().setHours(0, 0, 0, 0);
            return sel >= today;
        },
        },
        mounted() {
          this.fetchSuggestedEmails();
          this.fetchSourceFiles();

          document.addEventListener("click", (e) => {
            // Handle Source File closing
            if (!e.target.closest(".custom-select-wrapper")) {
              this.isSourceListOpen = false;
            }
            // Handle Primary closing
            if (!e.target.closest(".primary-email-wrapper")) {
              this.isPrimaryListOpen = false;
            }
            // Handle Secondary closing
            if (!e.target.closest(".secondary-email-wrapper")) {
              this.isSecondaryListOpen = false;
            }
          });
        },

        methods: {
          // PRIMARY LOGIC
          selectPrimaryEmail(email) {
            this.header.primaryEmail = email;
            this.isPrimaryListOpen = false;
          },

          // SECONDARY LOGIC
          handleSecondaryFocus() {
            this.updateSecondaryQuery();
            this.isSecondaryListOpen = true;
          },

          updateSecondaryQuery() {
            const input = this.header.secondaryEmails || "";
            const parts = input.split(",");
            this.secondaryQuery = parts[parts.length - 1].trim();
          },

          selectSecondaryEmail(email) {
            const input = this.header.secondaryEmails || "";
            const parts = input.split(",");
            // Replace the last fragment with the selected email
            parts[parts.length - 1] = ` ${email}`;
            // Rebuild string and prepare for next entry
            this.header.secondaryEmails = parts.join(",").trim() + ", ";
            this.secondaryQuery = "";
            this.isSecondaryListOpen = true; // Keep open if they want to add another? or false to close.
          },

          fetchDataBySearch() {
            if (!this.header.sourceFileName) {
              return this.$root.showCustomAlert("Warning", "Please select a Source File first.", "warning");
            }
            if (!this.header.rfpNo && !this.header.invoiceNo) {
              return this.$root.showCustomAlert(
                "Input Needed",
                "Please provide either an RFP No. or Invoice No.",
                "warning"
              );
            }

            this.$root.triggerLoading("Searching record(s)...", 0);

            google.script.run
              .withSuccessHandler((res) => {
                this.$root.isLoading = false;

                if (res.status === "ALREADY_PAID") {
                  this.initParticulars();
                  return this.$root.showCustomAlert("Action Blocked", res.message, "warning");
                }

                if (res.status === "FOUND") {
                  const matches = res.data; // Now expecting an array

                  if (matches.length === 1) {
                    this.populateForm(matches[0]);
                  } else if (matches.length > 1) {
                    this.searchResults = matches;
                    this.isSearchModalOpen = true;
                  } else {
                    this.$root.showCustomAlert("Not Found", "No matching records in the selected file.", "info");
                  }
                }
              })
              .withFailureHandler((err) => {
                this.$root.isLoading = false;
                this.$root.showCustomAlert("System Error", err.message, "error");
              })
              .getRfpDataAdvanced(this.header.sourceFileName, this.header.rfpNo, this.header.invoiceNo);
          },

          selectSourceFile(file) {
  // Sets visible name for the input box
  this.header.sourceFileName = file.name;
  
  // CRITICAL: Set the Tab Name and File URL to the header object
  this.header.sourceTabName = file.tabName;
  this.header.sourceFileUrl = file.url; 
  
  this.selectedSourceObj = file;
  this.isSourceListOpen = false;
  console.log("Selected URL:", this.header.sourceFileUrl);
},
          selectSearchResult(record) {
            this.populateForm(record);
            this.isSearchModalOpen = false;
          },

          populateForm(raw) {
            // 1. Handle Header Fields
            this.header.rfpNo = raw["RFP|PEF NO."] || "";
            this.header.invoiceNo = raw["INVOICE NO."] || "";
            this.header.dueDate = raw["DUE DATE"] || raw["DATE DUE"] || "";

            // 2. Capture Source Metadata
            // Prioritize metadata returned from the server-side search results
            this.header.sourceFileUrl = raw["META_SOURCE_URL"] || this.selectedSourceObj?.url || "N/A";

            // Update Tab Name: Check for meta tag first, then selected object, then fallback
            this.header.sourceTabName = raw["META_TAB_NAME"] || this.selectedSourceObj?.tabName || "MANUAL_ENTRY";

            // Update the visible filename in the UI if not already set
            if (!this.header.sourceFileName && this.selectedSourceObj) {
              this.header.sourceFileName = this.selectedSourceObj.fileName || this.selectedSourceObj.name;
            }

            // 3. Format and map Particulars
            const formattedData = {};
            this.tableFields.forEach((field) => {
              let val = raw[field] !== undefined && raw[field] !== null ? raw[field] : "";

              // Securely parse and format currency/amount fields
              if (this.isAmountField(field) && val !== "") {
                const cleanVal = String(val).replace(/[^0-9.-]/g, ""); // Support negative numbers
                const num = parseFloat(cleanVal);

                val = isNaN(num)
                  ? ""
                  : num.toLocaleString("en-US", {
                      minimumFractionDigits: 2,
                      maximumFractionDigits: 2,
                    });
              }
              formattedData[field] = val;
            });

            this.particulars = formattedData;

            // UI Feedback
            if (this.$root && typeof this.$root.showCustomAlert === "function") {
              this.$root.showCustomAlert("Success", "Record loaded successfully.", "success");
            }
          },
          fetchSourceFiles() {
  google.script.run
    .withSuccessHandler((data) => {
      this.sourceFiles = (data || []).map((item) => ({
        name: item.fileName || "",
        tabName: item.tabName || "",
        url: item.fileUrl || "", // Make sure URL is mapped here
        displayName: `${item.fileName} [${item.tabName}]`,
      }));
    })
    .withFailureHandler((err) => {
      console.error("Fetch Error:", err);
    })
    .getSourceFileNames();
},
          isAmountField(field) {
            const amountFields = ["CONTRACT AMOUNT", "SOA AMOUNT"];
            return amountFields.includes(field.toUpperCase());
          },

          /**
           * Applies the comma separators and 2 decimal places when user leaves the field
           */

          fetchSuggestedEmails() {
            google.script.run
              .withSuccessHandler((res) => {
                // Filters out empty values and ensures it's an array
                this.suggestedEmails = res && Array.isArray(res) ? res : [];
              })
              .withFailureHandler((err) => {
                console.error("Could not fetch suggestions:", err);
              })
              .getPreviousParticipantEmails();
          },

          generateRfp() {
            this.$root.triggerLoading("Generating RFP...", 0);
            google.script.run
              .withSuccessHandler((id) => {
                this.$root.isLoading = false;
                this.header.rfpNo = id;
                this.initParticulars();
                if (!this.header.dueDate) this.header.dueDate = new Date().toISOString().split("T")[0];
              })
              .withFailureHandler((err) => {
                this.$root.isLoading = false;
                this.$root.showCustomAlert("Error", "Generation failed: " + err, "error");
              })
              .generateRfpNumber();
          },

          isAmountField(f) {
            return ["CONTRACT AMOUNT", "SOA AMOUNT"].includes(f);
          },
          formatAmount(field) {
            if (!this.isAmountField(field)) return;
            let val = String(this.particulars[field] || "").replace(/[^0-9.]/g, "");
            const num = parseFloat(val);
            if (isNaN(num)) {
              this.particulars[field] = "";
            } else {
              this.particulars[field] = num.toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              });
            }
          },
          handleFileChange(e) {
            const file = e.target.files[0];
            if (!file || file.type !== "application/pdf") return;
            const reader = new FileReader();
            reader.onload = (f) => {
              this.attachment = {
                name: file.name,
                type: file.type,
                size: file.size,
                base64: f.target.result.split(",")[1],
              };
            };
            reader.readAsDataURL(file);
          },
          initParticulars() {
            const freshData = {};
            this.tableFields.forEach((field) => (freshData[field] = ""));
            this.particulars = freshData;
          },

          submitForm() {

            const hasRfp = !!(this.header.rfpNo?.trim());
            const hasInvoice = !!(this.header.invoiceNo?.trim());

            // 1. Basic Header Validation
            if (!this.header.rfpNo) return this.$root.showCustomAlert("Error", "RFP Number is missing.", "warning");
            if (!this.header.dueDate) return this.$root.showCustomAlert("Error", "Due Date is required.", "warning");

            // NEW: Ensure Source and Tab are actually selected for the payload
            if (!this.header.sourceFileName) {
                this.header.sourceFileName = "MANUAL_ENTRY";
                this.header.sourceTabName = "N/A";
                this.header.sourceFileUrl = "N/A";
            }
            // 1. Mandatory Identifier Check
              if (!hasInvoice) {
                  return this.$root.showCustomAlert("Error", "Invoice Number is required.", "warning");
              }
              
              // Specific logic: if RFP has value, invoice must not be empty 
              // (This is already covered by !hasInvoice, but let's be explicit if you want)
              if (hasRfp && !hasInvoice) {
                  return this.$root.showCustomAlert("Error", "Invoice Number must be provided alongside RFP.", "warning");
              }

            // 2. Security/Date Validation
            if (!this.isSecurityValidated)
              return this.$root.showCustomAlert("Error", "Invalid or Past Due Date.", "error");

            // 3. Particulars Validation
            const missingFields = this.tableFields.filter((f) => !String(this.particulars[f] || "").trim());
            if (missingFields.length > 0) {
              return this.$root.showCustomAlert("Missing Data", "Please fill all particulars fields.", "warning");
            }

            // 4. File Attachment Validation
            if (!this.attachment.base64) {
              return this.$root.showCustomAlert("File Missing", "Please upload the PRF document.", "warning");
            }

            // 5. Participants Formatting
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const primaryClean = (this.header.primaryEmail || "").trim();
            if (!emailRegex.test(primaryClean)) {
              return this.$root.showCustomAlert("Required", "Invalid Primary Email.", "warning");
            }

            const formattedParticipants = [{ email: primaryClean.toLowerCase(), tag: "Primary" }];
            const secondaryRaw = (this.header.secondaryEmails || "").trim();
            if (secondaryRaw) {
              secondaryRaw
                .split(",")
                .map((e) => e.trim())
                .filter((e) => e !== "")
                .forEach((email) => {
                  if (emailRegex.test(email)) {
                    formattedParticipants.push({ email: email.toLowerCase(), tag: "Secondary" });
                  }
                });
            }

            // 6. Build Final Payload and Execute
            const payload = {
              header: this.header, // Contains rfpNo, dueDate, sourceFileName, sourceFileUrl, sourceTabName
              particulars: this.particulars,
              attachment: this.attachment,
              participants: formattedParticipants,
              tableFields: this.tableFields,
            };

            this.isSubmitting = true;
            google.script.run
              .withSuccessHandler((res) => {
                this.isSubmitting = false;
                if (res.success) {
                  this.$root.showCustomAlert(res.message, "Recorded successfully!");
                   this.resetForm(); 
                } else {
                  this.$root.showCustomAlert("Submission Failed", res.message, "danger");
                }
              })
              .withFailureHandler((err) => {
                this.isSubmitting = false;
                this.$root.showCustomAlert("Error", err.message, "danger");
              })
              .processSubmission(payload);
          },

          resetForm() {
    // 1. Reset Header Object
    this.header = {
        rfpNo: "",
        invoiceNo: "",
        date: new Date().toISOString().split("T")[0], // Keep today's date
        dueDate: "",
        sourceFileName: "", 
        sourceTabName: "", 
        sourceFileUrl: "",
        primaryEmail: "",
        secondaryEmails: ""
    };

    // 2. Clear Particulars (the table details)
    this.initParticulars();

    // 3. Clear Attachment Object
    this.attachment = {
        name: "",
        type: "",
        size: 0,
        base64: ""
    };

    // 4. CRITICAL: Clear the physical file input from the browser
    if (this.$refs.fileInput) {
        this.$refs.fileInput.value = "";
    }

    // 5. Reset UI states
    this.isSubmitting = false;
    this.isSourceListOpen = false;
    this.isPrimaryListOpen = false;
    this.isSearchModalOpen = false;
    
    // Optional: Refresh suggestions if they were cleared
    // this.fetchSourceFiles(); 
    // this.fetchSuggestedEmails();

    console.log("All form fields have been cleared.");
},
          executeSubmission() {
            this.isSubmitting = true;
            this.$root.triggerLoading("Submitting Request...", 0);

            // Create a deep copy to avoid UI flickering during cleanup
            const submissionData = JSON.parse(JSON.stringify(this.particulars));

            // Remove commas from amount fields for database compatibility
            this.tableFields.forEach((field) => {
              if (this.isAmountField(field) && submissionData[field]) {
                submissionData[field] = submissionData[field].replace(/,/g, "");
              }
            });

            const payload = {
              header: {
                ...this.header,
                payee: this.particulars["PAYEE NAME"],
              },
              attachment: this.attachment,
              particulars: submissionData, // Cleaned data
              tableFields: this.tableFields,
              participants: this.finalParticipantPayload,
            };

            google.script.run
              .withSuccessHandler((res) => {
                this.isSubmitting = false;
                this.$root.isLoading = false;
                if (res.success) {
                  this.$root.showCustomAlert("Success", "RFP recorded successfully.", "success");
                  this.resetFormAfterSubmission();
                } else {
                  this.$root.showCustomAlert("Error", res.message, "error");
                }
              })
              .processSubmission(payload);
          },
          resetFormAfterSubmission() {
            this.header.rfpNo = "";
            this.header.invoiceNo = ""; // Reset this too
            this.header.dueDate = "";
            this.header.primaryEmail = "";
            this.header.secondaryEmails = "";
            // Note: keeping sourceFileName is usually better for the user,
            // but if you want it gone: this.header.sourceFileName = "";

            this.initParticulars();
            this.attachment = { name: "", type: "", size: 0, base64: "" };

            if (this.$refs.fileInput) this.$refs.fileInput.value = "";
          },
          goBack() {
            this.$emit("navigate", "dashboard");
          },
          printForm() {
            window.print();
          },
        },
      };
      const app = Vue.createApp({
        data() {
          return {
            isLoading: true,
            loadingMessage: "Initializing Platform...",
            currentView: "login",
            alertTitle: "",
            alertMessage: "",
            alertType: "info",
            alertModalInstance: null,
            // --- BACKEND BOUNDARY: User Session State ---
            // Backend Dev: Store the active user's details (e.g., email, role, full name) here upon successful login.
            currentUser: null,
          };
        },
        computed: {
          alertTypeClass() {
            const map = {
              success: "text-success",
              error: "text-danger",
              info: "text-primary",
              warning: "text-warning",
            };
            return map[this.alertType] || "text-primary";
          },
          alertIconClass() {
            const map = {
              success: "bi-check-circle-fill",
              error: "bi-x-circle-fill",
              info: "bi-info-circle-fill",
              warning: "bi-exclamation-triangle-fill",
            };
            return map[this.alertType] || "bi-info-circle-fill";
          },
        },
        components: {
          "login-view": LoginView,
          "register-view": RegisterView,
          "forgot-password-view": ForgotPasswordView,
          "dashboard-view": DashboardView,
          "form-request-view": FormRequestView,
        },
        methods: {
          triggerLoading(message, duration = 1000) {
            this.loadingMessage = message;
            this.isLoading = true;
            if (duration > 0)
              setTimeout(() => {
                this.isLoading = false;
              }, duration);
          },
          changeView(viewName) {
            //this.triggerLoading("Loading View...", 500); // Slightly faster transition
            this.currentView = viewName;
          },
          showCustomAlert(title, message, type = "info") {
            this.alertTitle = title;
            this.alertMessage = message;
            this.alertType = type;
            if (!this.alertModalInstance)
              this.alertModalInstance = new bootstrap.Modal(document.getElementById("customAlertModal"));
            this.alertModalInstance.show();
          },
        },
        mounted() {
          setTimeout(() => {
            this.isLoading = false;
          }, 1000);
        },
      });

      app.mount("#app");
  </script>
</body>

</html>
