    /* ==========================================
     BASE UI & LOADING PANE
     ========================================== */
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    #loading-pane {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-logo {
      max-width: 250px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    /* DASHBOARD CARDS */
    .card-form {
      border-left: 5px solid #0d6efd;
    }

    .elegant-card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: 0.2s;
      border-radius: 10px;
      cursor: pointer;
    }

    .elegant-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .note-line {
      width: 100%;
      height: 30px;
      border-bottom: 1px solid #000 !important;
      margin-top: 2px;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      .printable-content,
      .printable-content * {
        visibility: visible;
      }

      @page {
        size: letter portrait;
        margin: 0.4in;
      }

      .printable-content {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }

      .print-logo {
        display: block !important;
      }

      /* 1. FORCE THE GRID TO STAY RECTANGULAR */
      .particulars-grid {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        /* STOPS WIDTH ADJUSTMENT */
        border: 1.5px solid #000 !important;
      }

      /* 2. FORCE WRAPPING ON TEXT */
      .grid-cell {
        border: 1px solid #000 !important;
        padding: 8px 10px;
        vertical-align: top;
        width: 33.33%;
        /* Strict Column Width */
        word-wrap: break-word;
        /* Standard */
        overflow-wrap: break-word;
        /* Modern */
        white-space: normal;
        /* Ensure spaces trigger wrapping */
      }

      .meta-table {
        width: 100%;
        border: none !important;
        margin-bottom: 25px;
        table-layout: fixed;
      }

      .meta-table td {
        border: none !important;
        vertical-align: bottom;
      }

      .sig-name-line {
        border-top: 1.2px solid #000 !important;
        width: 90%;
        margin: 45px auto 0 auto;
        font-size: 8pt;
        font-weight: bold;
        text-transform: uppercase;
        padding-top: 5px;
        text-align: center;
      }
    }

    .custom-dropdown-menu {
      border: 1px solid #dee2e6;
      border-top: none;
      background: white;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
    }

    .custom-dropdown-menu .list-group-item {
      cursor: pointer;
      font-size: 0.9rem;
      padding: 10px 15px;
      border: none;
      border-bottom: 1px solid #f8f9fa;
    }

    .custom-dropdown-menu .list-group-item:last-child {
      border-bottom: none;
    }

    .custom-dropdown-menu .list-group-item:hover {
      background-color: #f0f7ff;
      color: #0d6efd;
    }

    .cursor-pointer {
      cursor: pointer;
    }

    /* Progress Stepper */
    .step-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e9ecef;
      color: #adb5bd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .step-dot.active {
      background: #0d6efd;
      color: white;
    }

    .step-line {
      flex-grow: 1;
      height: 2px;
      background: #e9ecef;
      margin: auto 8px;
    }

    .icon-circle {
      width: 60px;
      height: 60px;
      background: #f8f9fa;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Password Toggle Icon positioning */
    .password-toggle-icon-new {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      z-index: 10;
      color: #6c757d;
    }

    .password-toggle-icon-new:hover {
      color: #0d6efd;
    }

    /* Helpers */
    .tiny {
      font-size: 0.75rem;
    }

    .tracking-wider {
      letter-spacing: 0.05em;
    }

    .letter-spacing-lg {
      letter-spacing: 5px;
    }

    /* Animation - requires Animate.css link in header or can be replaced with custom transitions */
    .animate__animated {
      animation-duration: 0.5s;
    }
  </style>
</head>

<body>
  <div id="app">
    <div v-if="isLoading" id="loading-pane">
      <img src="https://d2nnykqiaju69u.cloudfront.net/pslife_photos/Maricel_temp/logos/megaworld%20lifestyel%20malls.png" alt="Logo" class="loading-logo mb-3" />
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted fw-bold">{{ loadingMessage }}</p>
    </div>

    <div class="modal fade" id="customAlertModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" :class="alertTypeClass">
              <i :class="alertIconClass"></i> {{ alertTitle }}
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center py-4">
            <p class="fs-5">{{ alertMessage }}</p>
          </div>
          <div class="modal-footer border-0 justify-content-center">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">
                Acknowledge
              </button>
          </div>
        </div>
      </div>
    </div>

    <div class="container py-5" v-show="!isLoading">
      <div class="text-center mb-5" v-if="!['login', 'register', 'forgot_password'].includes(currentView)">
        <img src="https://d2nnykqiaju69u.cloudfront.net/pslife_photos/Maricel_temp/logos/megaworld%20lifestyel%20malls.png" alt="Megaworld Logo" style="height: 60px" />
        <h4 class="mb-0 fw-bold" style="color: var(--primary-calm)">Payment Endorsement Platform</h4>
        <p class="text-muted small mb-0 font-monospace text-uppercase" style="letter-spacing: 1px">Payment Coordination
          Unit</p>

      </div>

      <login-view v-if="currentView === 'login'" @navigate="changeView"></login-view>
      <register-view v-if="currentView === 'register'" @navigate="changeView"></register-view>
      <forgot-password-view v-if="currentView === 'forgot_password'" @navigate="changeView"></forgot-password-view>
      <dashboard-view v-if="currentView === 'dashboard'" @navigate="changeView"></dashboard-view>
      <form-request-view v-if="currentView === 'form_request'" @navigate="changeView"></form-request-view>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --- COMPONENT: Login View ---
      const LoginView = {
        template: `
    <div class="auth-page-static d-flex align-items-center justify-content-center"
         style="height: 100vh; width: 100vw; overflow: hidden; background-color: #f4f7f6; position: fixed; top: 0; left: 0;">

        <div class="auth-container animation-fade-in w-100" style="max-width: 520px; padding: 20px;">
            <div class="card elegant-card border-0 p-4 p-md-5 shadow-lg" style="border-radius: 15px;">

                <div class="text-center mb-4">
                    <img src="https://d2nnykqiaju69u.cloudfront.net/pslife_photos/Maricel_temp/logos/megaworld%20lifestyel%20malls.png"alt="Megaworld Logo" style="height: 60px;" class="mb-3">
                    <h4 class="fw-bold text-secondary" style="font-size: 1.1rem; letter-spacing: 0.5px;">PAYMENT ENDORSEMENT PLATFORM</h4>
                    <p class="text-muted small">Sign in to your account</p>
                </div>
                <form @submit.prevent="submitLogin" id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">EMAIL ADDRESS</label>
                        <inpu type="email" name="email" class="form-control form-control-lg bg-light border-0 shadow-sm" v-model="credentials.email" placeholder="example@megaworld-lifestyle.com" autocomplete="username email" list="emailHistory" required>
                        <datalist id="emailHistory">
                            <option v-for="email in suggestedEmails" :key="email" :value="email"></option>
                        </datalist>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">PASSWORD</label>
                        <div class="password-wrapper position-relative">
                            <input :type="showPassword ? 'text' : 'password'"
                                   name="password"
                                   class="form-control form-control-lg bg-light border-0 shadow-sm pe-5"
                                   v-model="credentials.password"
                                   autocomplete="current-password"
                                   required>
                            <i :class="['bi', showPassword ? 'bi-eye-slash' : 'bi-eye', 'password-toggle-icon']"
                               style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d;"
                               @click="showPassword = !showPassword"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow mb-3" style="border-radius: 8px;">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="#" class="text-decoration-none small text-primary fw-semibold d-block mb-2"
                       @click.prevent="$emit('navigate', 'forgot_password')">Forgot Password?</a>
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="#" class="text-decoration-none small fw-bold"
                       @click.prevent="$emit('navigate', 'register')">Create Account</a>
                </div>
            </div>
        </div>
    </div>
    `,
        data() {
          return {
            credentials: { email: "", password: "" },
            showPassword: false,
            suggestedEmails: [],
          };
        },
        mounted() {
          this.loadSuggestedEmails();
        },
        methods: {
          loadSuggestedEmails() {
            try {
              const history = localStorage.getItem("pep_login_history");
              this.suggestedEmails = history ? JSON.parse(history) : [];
            } catch (e) {
              console.warn("Local storage inaccessible", e);
            }
          },
          saveEmailToHistory(email) {
            try {
              let historySet = new Set(this.suggestedEmails);
              historySet.add(email.toLowerCase().trim());
              const updatedHistory = Array.from(historySet).slice(-5);
              localStorage.setItem(
                "pep_login_history",
                JSON.stringify(updatedHistory),
              );
              this.suggestedEmails = updatedHistory;
            } catch (e) {
              console.error("History sync failed", e);
            }
          },
          submitLogin() {
            if (!this.credentials.email || !this.credentials.password) {
              return this.$root.showCustomAlert(
                "Input Error",
                "Enter credentials.",
                "warning",
              );
            }
            this.$root.triggerLoading("Verifying Account Access...", 0);
            google.script.run
              .withSuccessHandler((response) => {
                this.$root.isLoading = false;
                this.$root.currentUser = response.user.fullName;
                this.$root.currentUserEmail = response.user.email;
                // Save to custom history and trigger browser save-password prompt
                this.saveEmailToHistory(this.credentials.email);
                this.$root.showCustomAlert(
                  "Welcome",
                  "Login successful.",
                  "success",
                );
                this.$emit("navigate", "dashboard");
              })
              .withFailureHandler((err) => {
                this.$root.isLoading = false;
                this.$root.showCustomAlert(
                  "Login Failed",
                  err.message,
                  "error",
                );
              })
              .authenticateUser(this.credentials);
          },
        },
      };
      const RegisterView = {
        template: `
    <div class="auth-container mt-5">
        <div class="card elegant-card border-0 p-4 shadow-lg mx-auto" style="max-width: 450px;">

              "MANUAL_ENTRY";
            // If a source was picked but filename display is missing, restore it
            if (!this.header.sourceFileName && this.selectedSourceObj) {
              this.header.sourceFileName =
                this.selectedSourceObj.fileName || this.selectedSourceObj.name;
            }
            // 3. Mapping Particulars (Table Fields)
            const formattedData = {};
            this.tableFields.forEach((field) => {
              // Extract the value from the database object
              let val =
                raw[field] !== undefined && raw[field] !== null ?
                raw[field] :
                "";
              // Apply financial formatting to amount fields
              if (this.isAmountField(field) && val !== "") {
                const cleanVal = String(val).replace(/[^0-9.-]/g, ""); // Support numeric values
                const num = parseFloat(cleanVal);
                val = isNaN(num) ?
                  "" :
                  num.toLocaleString("en-US", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                  });
              }
              formattedData[field] = val;
            });
            // Set the reactively bound particulars object
            this.particulars = formattedData;
            // UI Success Feedback
            if (this.$root && typeof this.$root.showCustomAlert === "function") {
              this.$root.showCustomAlert(
                "Record Synced",
                this.submissionMode === "GENERATED" ?
                "Record data merged with your generated RFP number." :
                "All record details have been successfully loaded.",
                "success"
              );
            }
          },
          fetchSourceFiles() {
            google.script.run
              .withSuccessHandler((data) => {
                this.sourceFiles = (data || []).map((item) => ({
                  name: item.fileName || "",
                  tabName: item.tabName || "",
                  url: item.fileUrl || "", // Make sure URL is mapped here
                  displayName: `${item.fileName} [${item.tabName}]`,
                }));
              })
              .withFailureHandler((err) => {
                console.error("Fetch Error:", err);
              })
              .getSourceFileNames();
          },
          isAmountField(field) {
            const amountFields = ["CONTRACT AMOUNT", "SOA AMOUNT"];
            return amountFields.includes(field.toUpperCase());
          },
          /**
           * Applies the comma separators and 2 decimal places when user leaves the field
           */
          fetchSuggestedEmails() {
            google.script.run
              .withSuccessHandler((res) => {
                // Filters out empty values and ensures it's an array
                this.suggestedEmails = res && Array.isArray(res) ? res : [];
              })
              .withFailureHandler((err) => {
                console.error("Could not fetch suggestions:", err);
              })
              .getPreviousParticipantEmails();
          },
          generateRfp() {
            this.$root.triggerLoading("Generating RFP...", 0);
            google.script.run
              .withSuccessHandler((id) => {
                this.$root.isLoading = false;
                this.header.rfpNo = id;
                this.submissionMode = "GENERATED"; // THIS DISABLES THE RFP SEARCH BUTTON
                this.initParticulars();
                if (!this.header.dueDate)
                  this.header.dueDate = new Date().toISOString().split("T")[0];
              })
              .withFailureHandler((err) => {
                this.$root.isLoading = false;
                this.$root.showCustomAlert("Error", "Generation failed: " + err, "error");
              })
              .generateRfpNumber();
          },
          isAmountField(f) {
            return ["CONTRACT AMOUNT", "SOA AMOUNT"].includes(f);
          },
          formatAmount(field) {
            if (!this.isAmountField(field)) return;
            let val = String(this.particulars[field] || "").replace(
              /[^0-9.]/g,
              "",
            );
            const num = parseFloat(val);
            if (isNaN(num)) {
              this.particulars[field] = "";
            } else {
              this.particulars[field] = num.toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              });
            }
          },
          handleFileChange(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== "application/pdf") {
              return this.$root.showCustomAlert("Error", "Only PDF files are allowed.", "warning");
            }
            // 1. Calculate Current Cumulative Size
            const currentTotal = this.attachments.reduce((sum, f) => sum + (f.size || 0), 0);
            const newSize = file.size;
            // 2. Size Validation (Combined total)
            if (currentTotal + newSize > this.maxTotalSizeBytes) {
              const remainingSpace = ((this.maxTotalSizeBytes - currentTotal) / (1024 * 1024)).toFixed(2);
              return this.$root.showCustomAlert(
                "Attachment Too Large",
                `Adding this file would exceed the 15MB total limit. You only have ${remainingSpace}MB remaining space.`,
                "error"
              );
            }
            // 3. File Count Validation
            if (this.attachments.length >= this.maxFiles) {
              return this.$root.showCustomAlert("Limit reached", "Maximum 5 files allowed.", "info");
            }
            const reader = new FileReader();
            reader.onload = (f) => {
              this.attachments.push({
                name: file.name,
                type: file.type,
                size: file.size, // Essential to keep this to calculate totals
                base64: f.target.result.split(",")[1],
                notes: ""
              });
              e.target.value = "";
            };
            reader.readAsDataURL(file);
          },
          initParticulars() {
            const freshData = {};
            this.tableFields.forEach((field) => (freshData[field] = ""));
            this.particulars = freshData;
          },
          submitForm() {
            // 1. Identify current session user
            const appUserEmail = this.$root.currentUserEmail || "Unknown App User";
            // 2. Enable UI error highlighting
            this.showErrors = true;
            // 3. Header Validation (Conditional RFP Logic)
            const hasInvoice = !!this.header.invoiceNo?.trim();
            const hasRfp = !!this.header.rfpNo?.trim();
            const hasDueDate = !!this.header.dueDate;
            // Determine if RFP is mandatory: 
            // If search was NOT via Invoice, or if Invoice is empty, RFP must be present.
            const isRfpOptional = (this.searchType === 'INVOICE' && hasInvoice);
            const rfpCheckPassed = isRfpOptional || hasRfp;
            if (!hasInvoice || !hasDueDate || !rfpCheckPassed) {
              let errorMsg = "Please ensure Invoice No. and Due Date are filled.";
              if (!rfpCheckPassed) {
                errorMsg = "An RFP No. is required unless you have successfully searched via Invoice No.";
              }
              return this.$root.showCustomAlert(
                "Missing Information",
                errorMsg,
                "warning"
              );
            }
            // 4. Security/Date Validation
            if (!this.isSecurityValidated) {
              return this.$root.showCustomAlert(
                "Invalid Date",
                "The selected Due Date cannot be in the past.",
                "error"
              );
            }
            // 5. Particulars Grid Validation 
            const internalFields = ["RFP|PEF NO.", "INVOICE NO.", "INVOICE NO"];
            const missingFields = this.tableFields.filter(field => {
              const isHeaderField = internalFields.includes(field.toUpperCase());
              const value = String(this.particulars[field] || "").trim();
              // If it's a header field (like RFP), we ignore it in this particulars loop
              if (isHeaderField) return false;
              return value === "";
            });
            // 6. Attachment Validation (Enforcing accuracy against source file)
            if (!this.attachments || this.attachments.length === 0) {
              return this.$root.showCustomAlert("Attachment Required", "Please upload at least one PDF document.", "warning");
            }
            // BLOCKER 1: Configuration Check
            if (!this.isLabelConfigValid || this.fileTypeLabels.length === 0) {
              return this.$root.showCustomAlert("System Error", "Document type list (FILE NOTES) is missing or could not be loaded. Submission is blocked.", "danger");
            }
            // BLOCKER 2: Mandatory and Accurate Note Check
            const hasInvalidNotes = this.attachments.some((f) => {
              const note = (f.notes || "").trim();
              if (!note) return true; // Fail if empty
              // Check if the typed note exists in the fileTypeLabels list
              // (Ignoring case for flexibility, but enforcing content matching)
              const exists = this.fileTypeLabels.some(label => label.toUpperCase() === note.toUpperCase());
              // Support the "OTHERS" override logic you previously established
              const isOthers = note.toUpperCase().startsWith("OTHERS:");
              return !exists && !isOthers;
            });
            if (hasInvalidNotes) {
              return this.$root.showCustomAlert(
                "Invalid Note Selection",
                "One or more file notes do not match the required document categories from the source list.",
                "warning"
              );
            }
            // 7. Participant Email Validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const primaryClean = (this.header.primaryEmail || "").trim();
            if (!emailRegex.test(primaryClean)) {
              return this.$root.showCustomAlert(
                "Email Error",
                "A valid Primary Recipient email is required.",
                "warning"
              );
            }
            const formattedParticipants = [{ email: primaryClean.toLowerCase(), tag: "Primary" }];
            const secondaryRaw = (this.header.secondaryEmails || "").trim();
            if (secondaryRaw) {
              secondaryRaw.split(",").forEach(email => {
                const clean = email.trim();
                if (clean && emailRegex.test(clean)) {
                  formattedParticipants.push({ email: clean.toLowerCase(), tag: "Secondary" });
                }
              });
            }
            // 8. Payload Preparation & Data Sanitization
            this.isSubmitting = true;
            this.$root.triggerLoading("Submitting your request...", 0);
            // Deep clone data and strip commas from financial values
            const finalParticulars = JSON.parse(JSON.stringify(this.particulars));
            this.tableFields.forEach(f => {
              if (this.isAmountField(f) && finalParticulars[f]) {
                finalParticulars[f] = finalParticulars[f].toString().replace(/,/g, '');
              }
            });
            const payload = {
              header: this.header,
              particulars: finalParticulars,
              attachments: this.attachments,
              participants: formattedParticipants,
              tableFields: this.tableFields,
              userAppEmail: appUserEmail,
              meta: {
                mode: this.submissionMode || "MANUAL",
                timestamp: new Date().toISOString()
              }
            };
            // 9. Execute Google Apps Script
            google.script.run
              .withSuccessHandler((res) => {
                this.isSubmitting = false;
                this.$root.isLoading = false;
                if (res.success) {
                  let successTitle = "Request Recorded";
                  let successMessage = "";
                  if (this.submissionMode === "GENERATED") {
                    successTitle = "New Request Created";
                    successMessage = `Request ${res.message} (RFP) has been submitted with a freshly generated ID.`;
                  } else if (this.submissionMode === "FETCHED") {
                    // DETECT IF SEARCH WAS VIA INVOICE
                    if (this.searchType === "INVOICE") {
                      successTitle = "Invoice Synced & Recorded";
                      successMessage = `Request for Invoice ${this.header.invoiceNo} has been successfully updated and processed.`;
                    } else {
                      successTitle = "Record Synced & Updated";
                      successMessage = `Request for RFP ${res.message} has been successfully updated and processed.`;
                    }
                  } else {
                    successTitle = "Submission Successful";
                    successMessage = `Manual payment request ${res.message} has been recorded successfully.`;
                  }
                  this.$root.showCustomAlert(successTitle, successMessage, "success");
                  // Cleanup
                  localStorage.removeItem('rfp_form_draft');
                  this.resetForm();
                  this.submissionMode = "MANUAL";
                  this.searchType = ""; // Reset search tracker
                } else {
                  this.$root.showCustomAlert("Submission Failed", res.message, "danger");
                }
              })
              .withFailureHandler((err) => {
                this.isSubmitting = false;
                this.$root.isLoading = false;
                this.$root.showCustomAlert("System Error", "Communication failure: " + err.message, "danger");
              })
              .processSubmission(payload);
          },
          resetForm() {
            this.showErrors = false;
            // 1. Reset Header Object
            this.header = {
              rfpNo: "",
              invoiceNo: "",
              date: new Date().toISOString().split("T")[0], // Keep today's date
              dueDate: "",
              sourceFileName: "",
              sourceTabName: "",
              sourceFileUrl: "",
              primaryEmail: "",
              secondaryEmails: "",
              remarks: "",
            };
            // 2. Clear Particulars (the table details)
            this.initParticulars();
            // 3. NEW: Clear the Multi-File Attachments Array
            // This removes all 5 files and their associated notes
            this.attachments = [];
            // 4. CRITICAL: Clear the physical file input from the browser
            // This allows the user to re-select the same file if they want
            if (this.$refs.fileInput) {
              this.$refs.fileInput.value = "";
            }
            // 5. Reset all UI/Dropdown states
            this.isSubmitting = false;
            this.isSourceListOpen = false;
            this.isPrimaryListOpen = false;
            this.isSecondaryListOpen = false; // Added to ensure secondary dropdown closes
            this.isSearchModalOpen = false;
            // Reset search results if any
            this.searchResults = [];
            localStorage.removeItem('rfp_form_draft');
            this.searchType = "";
            console.log("Form reset: Multi-file attachments and all metadata cleared.");
          },
          goBack() {
            this.$emit("navigate", "dashboard");
          },
          printForm() {
            window.print();
          },
        },
      };
      const app = Vue.createApp({
        data() {
          return {
            isLoading: true,
            loadingMessage: "Initializing Platform...",
            currentView: "login",
            alertTitle: "",
            alertMessage: "",
            alertType: "info",
            alertModalInstance: null,
            // --- BACKEND BOUNDARY: User Session State ---
            // Backend Dev: Store the active user's details (e.g., email, role, full name) here upon successful login.
            currentUserEmail: null,
          };
        },
        computed: {
          alertTypeClass() {
            const map = {
              success: "text-success",
              error: "text-danger",
              info: "text-primary",
              warning: "text-warning",
            };
            return map[this.alertType] || "text-primary";
          },
          alertIconClass() {
            const map = {
              success: "bi-check-circle-fill",
              error: "bi-x-circle-fill",
              info: "bi-info-circle-fill",
              warning: "bi-exclamation-triangle-fill",
            };
            return map[this.alertType] || "bi-info-circle-fill";
          },
        },
        components: {
          "login-view": LoginView,
          "register-view": RegisterView,
          "forgot-password-view": ForgotPasswordView,
          "dashboard-view": DashboardView,
          "form-request-view": FormRequestView,
        },
        methods: {
          triggerLoading(message, duration = 1000) {
            this.loadingMessage = message;
            this.isLoading = true;
            if (duration > 0)
              setTimeout(() => {
                this.isLoading = false;
              }, duration);
          },
          changeView(viewName) {
            //this.triggerLoading("Loading View...", 500); // Slightly faster transition
            this.currentView = viewName;
          },
          showCustomAlert(title, message, type = "info") {
            this.alertTitle = title;
            this.alertMessage = message;
            this.alertType = type;
            if (!this.alertModalInstance)
              this.alertModalInstance = new bootstrap.Modal(
                document.getElementById("customAlertModal"),
              );
            this.alertModalInstance.show();
          },
        },
        mounted() {
          setTimeout(() => {
            this.isLoading = false;
          }, 1000);
        },
      });
      app.mount("#app");
  </script>
</body>
